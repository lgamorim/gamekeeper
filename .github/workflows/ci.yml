name: CI

on:
  push:
    branches:
      - master
      - 'feature/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # Windows is the only supported platform, and the unit tests use Windows-style paths.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore GameKeeper.slnx

      - name: Build
        run: dotnet build GameKeeper.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test GameKeeper.slnx --configuration Release --no-build --verbosity normal
